<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>it's COOL · Seu guia</title>
<link rel="icon" href="simbolo.png?v=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap">
<style>
:root{
  --cereja:#a91231; --cereja-esc:#7d0c24; --cereja-claro:#b8203f; --terra:#e25a2f; --rosa:#bc657b; --bege:#f6e9dd; --cinza:#3a3a3a;
  --bege-claro:#fbf4ec; --bege-esc:#efdccb; --rosa-soft:#f3dadf; --terra-soft:#f7d9cb; --cereja-soft:#f2d0d6; --white:#fffdfb;
  --ink:#3a3a3a; --muted:#7a6a6c; --line:#ecd9cc;
  --serif:'DM Serif Display',Georgia,'Times New Roman',serif; --sans:'Poppins','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bege);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.topbar{background:var(--cereja);color:#fff;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;text-align:center;padding:7px 12px;display:flex;justify-content:center;gap:22px;flex-wrap:wrap;position:relative;z-index:2;font-weight:500}
.topbar span::after{content:"·";margin-left:22px;opacity:.7}
.topbar span:last-child::after{content:""}
/* fundo quente: blob terracota, blob rosa e a mão OK como marca d'água */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;transition:opacity .4s}
.bg .b1{position:absolute;right:-12vw;top:-14vh;width:min(62vw,900px);height:110vh;background:var(--terra);opacity:.14;border-radius:46% 54% 42% 58%/58% 42% 58% 42%}
.bg .b2{position:absolute;left:-16vw;bottom:-30vh;width:min(50vw,700px);height:70vh;background:var(--rosa);opacity:.16;border-radius:55% 45% 50% 50%/45% 55% 45% 55%}
.bg .mao{position:absolute;right:4vw;top:50%;transform:translateY(-50%) rotate(-8deg);width:min(38vw,540px);aspect-ratio:1;background:url("simbolo.png?v=1") center/contain no-repeat;opacity:.08}
body.res .bg .mao{opacity:.04}
@media (max-width:900px){.bg .mao{width:70vw;right:-20vw;top:auto;bottom:-10vh;transform:rotate(-8deg)}}

.app{position:relative;z-index:1;max-width:1180px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:16px 22px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;min-height:64px}
.logo{display:block;line-height:0}
.logo img{height:64px;width:auto;display:block}
@media (max-width:600px){.logo img{height:52px}}
.stamp{font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-align:right;margin:-4px 2px 8px;opacity:.7}

.card{background:var(--white);border:1px solid var(--line);border-radius:22px;padding:28px 26px;box-shadow:0 14px 40px rgba(120,60,50,.08)}
.qwrap{max-width:660px;width:100%;margin:8px auto 0}
.progress{height:6px;background:var(--bege-esc);border-radius:999px;overflow:hidden;margin:0 0 22px}
.progress i{display:block;height:100%;background:var(--cereja);border-radius:999px;transition:width .35s ease}
.step{font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;color:var(--terra);font-weight:600;margin-bottom:10px}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(1.65rem,4.4vw,2.2rem);line-height:1.15;color:var(--cereja);margin:0 0 10px;text-wrap:balance}
h1 i{font-style:italic;color:var(--terra)}
.sub{color:var(--muted);font-size:.95rem;margin:0 0 20px}
.opts{display:grid;gap:10px;margin:0;padding:0;list-style:none}
@media (min-width:640px){.opts.two{grid-template-columns:1fr 1fr}.opts.icons{grid-template-columns:repeat(3,1fr)}}
.opt{width:100%;height:100%;text-align:left;background:var(--bege-claro);border:1.5px solid var(--line);border-radius:16px;padding:13px 15px;font:inherit;color:var(--ink);cursor:pointer;display:flex;align-items:flex-start;gap:12px;transition:border-color .15s, background .15s, transform .1s, box-shadow .15s}
.opt:hover{border-color:var(--rosa);background:#fff}
.opt:active{transform:scale(.99)}
.opt:focus-visible{outline:3px solid var(--terra-soft);outline-offset:2px}
.opt.on{border-color:var(--cereja);background:#fff;box-shadow:0 6px 18px rgba(169,18,49,.14)}
.opt .box{flex:none;width:20px;height:20px;margin-top:3px;border-radius:50%;border:1.5px solid var(--rosa);display:grid;place-items:center;transition:all .15s;background:#fff}
.opt.multi .box{border-radius:6px}
.opt.on .box{border-color:var(--cereja);background:var(--cereja)}
.opt.on .box::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.opt.multi.on .box::after{border-radius:2px;width:9px;height:5px;background:none;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:translateY(-1px) rotate(-45deg)}
.opt .t{flex:1}
.opt .t b{display:block;font-weight:600;line-height:1.3;font-size:.95rem;color:var(--cinza)}
.opt .t span{display:block;font-size:.82rem;color:var(--muted);margin-top:3px;line-height:1.4;font-weight:400}
.opt.ic{flex-direction:column;align-items:center;text-align:center;padding:18px 12px 16px;gap:8px;position:relative}
.opt.ic .box{position:absolute;top:10px;right:10px;margin:0}
.opt.ic .icon{width:44px;height:44px;color:var(--cereja)}
.opt.ic .icon svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.opt.ic .t b{font-size:.92rem}
.opt.ic .t span{font-size:.78rem}
.actions{display:flex;gap:10px;margin-top:22px;align-items:center;flex-wrap:wrap}
.btn{font-family:var(--sans);font-size:.8rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;border:0;border-radius:12px;padding:16px 26px;cursor:pointer;flex:1;transition:transform .12s, box-shadow .15s, background .15s;text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:10px;color:var(--ink);position:relative}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(1px);box-shadow:none!important}
.btn.primary,.btn.blue{background:var(--cereja);color:#fff;box-shadow:0 5px 0 var(--cereja-esc), 0 12px 22px rgba(169,18,49,.25)}
.btn.primary::after,.btn.blue::after{content:"→";font-size:1.05rem;line-height:1}
.btn.primary:hover,.btn.blue:hover{background:var(--cereja-claro)}
.btn.primary:active,.btn.blue:active{transform:translateY(4px);box-shadow:0 1px 0 var(--cereja-esc)!important}
.btn.primary:disabled{opacity:.45;cursor:default;box-shadow:0 3px 0 var(--rosa);transform:none}
.btn.primary:disabled::after{content:""}
.btn.ghost{background:#fff;color:var(--cereja);border:1.5px solid var(--cereja);flex:0 0 auto;padding:11px 16px;font-size:.72rem;border-radius:999px}
.btn.ghost::before{content:"←"}
.btn.ghost:hover{background:var(--cereja-soft)}
.btn.soft{background:#fff;color:var(--cereja);border:1.5px solid var(--cereja);box-shadow:0 4px 0 var(--cereja-soft)}
.btn.soft:hover{background:var(--cereja-soft)}
.btn.big{font-size:.9rem;padding:20px 30px}
.btn:focus-visible{outline:3px solid var(--terra-soft);outline-offset:2px}
.note{font-size:.82rem;color:var(--muted);margin-top:10px}
.hidden{display:none!important}
.fade{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.progress i{transition:none}}

/* boas-vindas */
.hero{max-width:620px;width:100%;margin:36px auto 0;padding:34px 30px 30px;text-align:center}
.selo{width:96px;height:96px;margin:0 0 18px}
.selo img{width:96px;height:96px;display:block;border-radius:50%;box-shadow:0 8px 20px rgba(169,18,49,.22)}
.hero h1{font-size:clamp(2rem,5vw,2.7rem);margin-bottom:12px}
.hero .lead{color:var(--muted);margin:0 0 16px;font-size:.97rem}
.hero .topicos{list-style:none;padding:0;margin:0 0 24px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;font-size:.82rem;line-height:1.35}
.hero .topicos li{padding:14px 12px;border-radius:12px;font-weight:500;color:#fff;text-align:center;display:flex;align-items:center;justify-content:center}
.hero .topicos li.c1{background:var(--cereja)}.hero .topicos li.c2{background:var(--terra)}.hero .topicos li.c3{background:var(--rosa)}
@media (max-width:520px){.hero .topicos{grid-template-columns:1fr}}
.hero .cta{display:inline-flex;width:auto;flex:none;padding:18px 30px;margin:0 auto;background:#F5B52E;color:#3a2a10;text-shadow:none;box-shadow:0 5px 0 #C48A12, 0 12px 24px rgba(196,138,18,.35);font-size:.86rem}
.hero .cta:hover{background:#FFC43D}
.hero .cta:active{box-shadow:0 1px 0 #C48A12!important}
.hero .selos{display:flex;gap:18px;flex-wrap:wrap;margin-top:20px;font-size:.76rem;color:var(--muted)}
.hero .selos span::before{content:"✓";color:var(--terra);margin-right:6px;font-weight:700}

/* resultado */
.r-head{display:grid;gap:14px;margin-bottom:18px}
@media (min-width:900px){.r-head{grid-template-columns:1.4fr 1fr;align-items:stretch}}
.r-open{font-family:var(--serif);font-size:clamp(1.55rem,3.4vw,2.1rem);font-weight:400;color:var(--cereja);line-height:1.18;margin:0 0 8px;text-wrap:balance}
.r-sub{color:var(--muted);margin:0 0 8px;font-size:.95rem}
.warn{background:var(--terra-soft);border-left:3px solid var(--terra);border-radius:0 14px 14px 0;padding:16px 18px;font-size:.92rem}
.warn b{display:block;color:var(--terra);margin-bottom:4px;font-weight:600}
.lbl{font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:6px 0 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip{display:inline-block;font-weight:600;font-size:.62rem;letter-spacing:.12em;padding:4px 10px;border-radius:999px;white-space:nowrap;line-height:1.5}
.c-conheca{background:var(--rosa-soft);color:#8c4358}.c-cuide{background:var(--terra-soft);color:#9a3a18}.c-vibre{background:var(--cereja-soft);color:var(--cereja)}
.c-dela{background:var(--rosa-soft);color:#8c4358}.c-dele{background:var(--bege-esc);color:#6b4a3a}.c-dagente{background:var(--terra-soft);color:#9a3a18}
.c-cool{background:var(--cereja);color:#fff}.c-match{background:var(--rosa);color:#fff}.c-sale{background:var(--terra);color:#fff}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));margin-bottom:16px}
.gcard{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 28px rgba(120,60,50,.06)}
.gcard .top{display:flex;gap:14px;align-items:flex-start}
.gcard .art{flex:none;width:84px;height:84px;border-radius:14px;overflow:hidden;background:var(--bege)}
.gcard .art img,.gcard .art svg{width:100%;height:100%;display:block;object-fit:cover}
.gcard .nm{font-family:var(--serif);font-weight:400;font-size:1.18rem;color:var(--cereja);line-height:1.2;margin:6px 0 2px}
.gcard .why{font-size:.82rem;color:var(--terra);font-weight:500}
.gcard .tem{font-size:.72rem;color:var(--muted);background:var(--bege);border-radius:999px;padding:2px 9px;display:inline-block;margin-top:4px}
.gcard dl{margin:0;display:grid;gap:6px;font-size:.88rem}
.gcard dt{font-size:.64rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:600}
.gcard dd{margin:0}
.gcard .bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:6px}
.gcard .faixa{font-size:.76rem;color:var(--muted)}
.gcard .buy{flex:0 0 auto;font-size:.68rem;padding:12px 16px;box-shadow:0 4px 0 var(--cereja-esc), 0 8px 14px rgba(169,18,49,.2)}
.duo{display:grid;gap:14px;margin-bottom:16px}
@media (min-width:900px){.duo{grid-template-columns:1fr 1.3fr}}
.block{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:18px}
.content{display:flex;gap:12px;align-items:center}
.content .ic{flex:none;width:46px;height:46px;border-radius:12px;background:var(--rosa-soft);display:grid;place-items:center;color:var(--cereja);font-weight:600;font-size:.64rem;letter-spacing:.1em}
.content b{display:block;font-family:var(--serif);font-weight:400;color:var(--cereja)}
.content span{font-size:.84rem;color:var(--muted)}
.foot{display:grid;gap:10px;margin-top:6px}
@media (min-width:640px){.foot{grid-template-columns:1fr 1fr}}
.debug{margin-top:26px;font-size:.76rem;color:var(--muted)}
.debug summary{cursor:pointer;font-weight:600}
.debug pre{background:var(--bege);padding:10px;border-radius:10px;overflow-x:auto;font-size:.7rem;line-height:1.4}
</style>
</head>
<body>
<div class="topbar"><span>Frete discreto</span><span>Embalagem neutra</span><span>Parcelamento em até 6x sem juros</span></div>
<div class="bg" aria-hidden="true"><div class="b1"></div><div class="b2"></div><div class="mao"></div></div>
<div class="app">
  <header>
    <a class="logo" href="#" onclick="refazer();return false" aria-label="it's COOL, prazer e bem-estar íntimo"><img src="logo.png?v=1" alt="it's COOL"></a>
    <button class="btn ghost" id="btnBack" type="button">Voltar</button>
  </header>
  <div class="stamp">versão 16</div>
  <main id="view"></main>
</div>

<script>
/* ============================================================
   LINKS (trocar pelos reais)
   ============================================================ */
const URL_SITE='https://itscool.com.br/';
const linkSite=slug=>URL_SITE+'categoria/'+slug;

/* ============================================================
   CATEGORIAS DO SITE
   ============================================================ */
const CAT={
  CONHECA:{nome:'CONHEÇA!',chip:'c-conheca',slug:'conheca'},
  CUIDE:{nome:'CUIDE!',chip:'c-cuide',slug:'cuide'},
  VIBRE:{nome:'VIBRE!',chip:'c-vibre',slug:'vibre'},
  DELA:{nome:'DELA!',chip:'c-dela',slug:'dela'},
  DELE:{nome:'DELE!',chip:'c-dele',slug:'dele'},
  DAGENTE:{nome:'DA GENTE!',chip:'c-dagente',slug:'da-gente'},
  COOL:{nome:'COOL',chip:'c-cool',slug:'cool'},
  MATCH:{nome:'COOL MATCH',chip:'c-match',slug:'cool-match'},
  SALE:{nome:'ITS SALE',chip:'c-sale',slug:'its-sale'},
};

/* ============================================================
   ILUSTRAÇÕES (SVG). Se um grupo tiver campo img, a foto substitui.
   ============================================================ */
const C={t:'#bc657b',r:'#f2cfc3',rs:'#fbe9e1',b:'#a91231',s:'#e7a98f',ss:'#f6dccd',y:'#e25a2f',ys:'#f8dccb',g:'#bc657b',gs:'#f3d9dc',bg:'#f6e9dd',bs:'#fbf3ea',w:'#FFFDFA'};
const svg=(bg,inner)=>`<svg viewBox="0 0 84 84" xmlns="http://www.w3.org/2000/svg"><rect width="84" height="84" fill="${bg}"/>${inner}</svg>`;
const ART={
  frasco:svg(C.ys,`<rect x="30" y="10" width="24" height="10" rx="3" fill="${C.t}"/><rect x="26" y="20" width="32" height="54" rx="10" fill="${C.w}"/><rect x="32" y="34" width="20" height="18" rx="4" fill="${C.r}"/>`),
  tubo:svg(C.rs,`<path d="M30 14h24l4 16v40a6 6 0 0 1-6 6H32a6 6 0 0 1-6-6V30z" fill="${C.w}"/><rect x="34" y="8" width="16" height="8" rx="2" fill="${C.b}"/><rect x="32" y="40" width="20" height="16" rx="4" fill="${C.s}"/>`),
  gota:svg(C.ss,`<path d="M42 12c10 16 20 26 20 40a20 20 0 0 1-40 0c0-14 10-24 20-40z" fill="${C.b}"/><circle cx="35" cy="56" r="5" fill="${C.w}" opacity=".7"/>`),
  oleo:svg(C.bs,`<rect x="28" y="24" width="28" height="50" rx="8" fill="${C.w}"/><rect x="34" y="10" width="16" height="16" rx="3" fill="${C.t}"/><path d="M28 46h28v20a8 8 0 0 1-8 8H36a8 8 0 0 1-8-8z" fill="${C.y}"/>`),
  camisinha:svg(C.gs,`<circle cx="42" cy="44" r="24" fill="${C.w}"/><circle cx="42" cy="44" r="12" fill="${C.g}"/><circle cx="42" cy="44" r="5" fill="${C.w}"/>`),
  espelho:svg(C.rs,`<circle cx="42" cy="34" r="20" fill="${C.w}" stroke="${C.t}" stroke-width="4"/><rect x="38" y="54" width="8" height="22" rx="4" fill="${C.t}"/><path d="M32 30a12 12 0 0 1 10-8" stroke="${C.s}" stroke-width="3" stroke-linecap="round" fill="none"/>`),
  cartas:svg(C.ys,`<rect x="18" y="22" width="34" height="46" rx="6" fill="${C.w}" transform="rotate(-10 35 45)"/><rect x="32" y="18" width="34" height="46" rx="6" fill="${C.w}" stroke="${C.t}" stroke-width="2"/><path d="M49 32l4 8 8 1-6 6 2 8-8-4-8 4 2-8-6-6 8-1z" fill="${C.t}"/>`),
  livro:svg(C.gs,`<path d="M16 22h24a4 4 0 0 1 4 4v42a4 4 0 0 0-4-4H16z" fill="${C.w}"/><path d="M68 22H44a4 4 0 0 0-4 4v42a4 4 0 0 1 4-4h24z" fill="${C.g}"/><rect x="20" y="30" width="14" height="3" rx="1.5" fill="${C.s}"/><rect x="20" y="38" width="16" height="3" rx="1.5" fill="${C.s}"/>`),
  cones:svg(C.ss,`<path d="M30 18a6 6 0 0 1 12 0v10a12 12 0 0 1-12 0z" fill="${C.w}"/><ellipse cx="36" cy="52" rx="14" ry="18" fill="${C.b}"/><ellipse cx="56" cy="54" rx="10" ry="14" fill="${C.s}"/><path d="M36 70v6M56 68v8" stroke="${C.b}" stroke-width="3" stroke-linecap="round"/>`),
  sugador:svg(C.rs,`<path d="M34 12h16a6 6 0 0 1 6 6v36a14 14 0 0 1-28 0V18a6 6 0 0 1 6-6z" fill="${C.t}"/><circle cx="42" cy="58" r="9" fill="${C.w}"/><circle cx="42" cy="58" r="4" fill="${C.r}"/><circle cx="42" cy="26" r="3" fill="${C.w}"/>`),
  bullet:svg(C.ys,`<path d="M42 10c10 0 14 8 14 20v30a14 14 0 0 1-28 0V30c0-12 4-20 14-20z" fill="${C.b}"/><circle cx="42" cy="62" r="4" fill="${C.w}"/><path d="M60 22l4-4M62 32h6M24 22l-4-4M22 32h-6" stroke="${C.t}" stroke-width="3" stroke-linecap="round"/>`),
  varinha:svg(C.ss,`<path d="M36 10h12a6 6 0 0 1 6 6v46a12 12 0 0 1-24 0V16a6 6 0 0 1 6-6z" fill="${C.t}"/><path d="M42 12c8 6 8 20 0 26" stroke="${C.w}" stroke-width="3" stroke-linecap="round" fill="none" opacity=".6"/><circle cx="42" cy="64" r="4" fill="${C.w}"/>`),
  rabbit:svg(C.rs,`<path d="M36 12h12a6 6 0 0 1 6 6v46a12 12 0 0 1-24 0V18a6 6 0 0 1 6-6z" fill="${C.b}"/><path d="M22 34c-6-6-6-16 0-22 6 6 6 16 0 22z" fill="${C.b}"/><path d="M22 34c4 4 6 10 6 16" stroke="${C.b}" stroke-width="6" stroke-linecap="round"/><circle cx="42" cy="64" r="4" fill="${C.w}"/>`),
  app:svg(C.gs,`<rect x="18" y="14" width="26" height="52" rx="6" fill="${C.w}"/><rect x="22" y="20" width="18" height="30" rx="3" fill="${C.ss}"/><path d="M56 30c6-4 12-4 14 4s-6 20-14 22c-8-2-16-14-14-22s8-8 14-4z" fill="${C.t}"/><path d="M48 16c6 0 10 4 10 10" stroke="${C.g}" stroke-width="3" stroke-linecap="round" fill="none"/>`),
  anel:svg(C.ss,`<circle cx="42" cy="44" r="22" fill="none" stroke="${C.b}" stroke-width="10"/><circle cx="42" cy="18" r="7" fill="${C.t}"/>`),
  ovo:svg(C.ys,`<path d="M42 12c12 0 20 16 20 32a20 20 0 0 1-40 0c0-16 8-32 20-32z" fill="${C.w}"/><path d="M30 44c4-6 8-8 12-8s8 2 12 8" stroke="${C.s}" stroke-width="3" stroke-linecap="round" fill="none"/>`),

const FASES=['posparto','amamentacao','menopausa','medicacao','tratamento'];
// wanted: lista de tags; PESO diz quanto cada tag vale (situação do corpo pesa mais que preferência)
let PESO={};
function rank(list,wanted,nivel,excl=[],owned=[]){
  const w=new Set(wanted);
  return list.filter(g=>g.nivel<=nivel&&!excl.some(t=>g.tags.includes(t)))
    .map(g=>{const own=g.tem&&owned.includes(g.tem); const raw=g.tags.reduce((n,t)=>n+(w.has(t)?(PESO[t]||1):0),0); return {g,own,s:own?raw/2:raw};})
    .filter(x=>x.s>0||wanted.length===0)
    .sort((x,y)=>(y.s-x.s)||(x.own-y.own)||(x.g.preco[0]-y.g.preco[0]));
}
function why(g,wanted){
  const W={secura:'ajuda na secura que você marcou',dor:'pensado pra desconforto na penetração',orgasmo:'o caminho mais curto pro orgasmo',
    desejo:'pra reaproximar do corpo sem pressão',rotina:'novidade a dois sem virar personagem',corpo:'pra conhecer seu corpo com calma',
    vergonha:'discreto, pra começar sem ansiedade',externo:'estímulo por fora, como você pediu',interno:'estímulo por dentro, como você pediu',ambos:'os dois estímulos juntos',
    anal:'feito pra isso, com segurança',dele:'pensado pra ele, e bom pra usar a dois',junto:'pensado pra usar a dois',naosei:'o mais simples pra começar',
    menopausa:'pensado pra menopausa',posparto:'seguro pro pós-parto',amamentacao:'compensa a secura da amamentação',tratamento:'suave e seguro durante o tratamento',medicacao:'alivia o efeito da medicação',
    saude:'treino do assoalho pélvico',silencioso:'silencioso de verdade',facil:'simples, sem manual',custo:'melhor custo-benefício do grupo',seguro:'material seguro, sem cheiro',agua:"à prova d'água",pequeno:'pequeno e discreto',
    delicado:'delicado, de cuidado',divertido:'leve e divertido',ousado:'ousado com classe'};
  const hit=wanted.find(t=>W[t]&&g.tags.includes(t));
  return hit?W[hit].replace(/^./,c=>c.toUpperCase()):'Um bom lugar pra começar';
}
const NIVEL={1:1,2:1,3:2,4:3};

function montar(a){

    R.grupos=[...p1,...p2].map(x=>({...x.g,why:why(x.g,w)}));

    R.kit=q==='casal'||c==='ousado'?KITS.dois:c==='divertido'?KITS.primeira:q==='amiga'?KITS.auto:KITS.conforto;
    R.conteudo=CONTEUDO.presente;

    R.abertura=`Um presente ${c==='delicado'?'de cuidado':c==='divertido'?'leve e divertido':'ousado com classe'} pra ${quem}.`;
    R.sub='Toda seleção de presente vai com um cartão com QR pra quem recebe montar o próprio guia.';
    R.ordem=[...new Set([R.principal,vit])];

  }

    saude:()=>{add('CONHECA',3);add('CUIDE',2)},curiosa:()=>{}})[m]());
  inc.forEach(t=>({secura:()=>add('CUIDE',2),dor:()=>add('CUIDE',2),orgasmo:()=>{add('VIBRE',2);add('CONHECA',1)},desejo:()=>{add('CUIDE',2);add('CONHECA',1)},
    vergonha:()=>add('CONHECA',2)})[t]());

  exp.forEach(t=>({externo:()=>add('VIBRE',2),interno:()=>add('VIBRE',2),ambos:()=>add('VIBRE',2),anal:()=>add('COOL',2),dele:()=>add('DELE',2),
    junto:()=>add('DAGENTE',2),naosei:()=>add('VIBRE',1)})[t]());
  if(a.paraQuem==='mim') add('DELA',1);
  if(a.paraQuem==='parceria'){add('DAGENTE',1); if(a.parceria==='mulher') add('DELA',1); if(a.parceria==='homem') add('DELE',1);}
  R.pontos=pts;

  let ordem=Object.entries(pts).sort((x,y)=>y[1]-x[1]).map(x=>x[0]);

  if(soCuriosa) ordem=['VIBRE','CONHECA',...ordem.filter(c=>c!=='VIBRE'&&c!=='CONHECA')];
  ordem=ordem.filter((c,i)=>i===0||(soCuriosa&&i<2)||(i<2?pts[c]>0:pts[c]>=2));
  R.ordem=ordem; R.principal=ordem[0];

    return r.slice(0,n).map(x=>{usados.add(x.g.id); return {...x.g,own:x.own,why:x.own?'Você já tem algo assim. Fica como referência.':why(x.g,base)};});
  };
  const cotas=[3,2,1,1];
  ordem.slice(0,4).forEach((c,i)=>{R.grupos.push(...pega(c,cotas[i]));});
  const temBrinquedo=R.grupos.some(g=>['VIBRE','DELA','DAGENTE','DELE','COOL'].includes(g.cat)&&!g.own);
  const temLub=R.grupos.some(g=>g.tem==='lub');
  if(temBrinquedo&&!temLub){
    const id=fase.length?'sem-perfume':'lubrificantes'; const g=GRUPOS.find(x=>x.id===id);

  }

  else if(motivos.includes('conhecer')||motivos.includes('saude')) R.kit=KITS.auto;

  if(inc.includes('dor')&&(fase.some(f=>criticas.includes(f))||nivel===1)) R.alerta='dor';

function abertura(m,f,inc){

  if(R.alerta==='dor') h+=`<div class="warn"><b>Isso merece atenção</b>Dor na relação não é normal e não é frescura. Os grupos abaixo ajudam no conforto, e vale muito uma conversa com ginecologista ou fisioterapeuta pélvica pra entender a causa.</div>`;
  else if(R.alerta==='tratamento') h+=`<div class="warn"><b>Um cuidado a mais</b>Durante um tratamento, combine qualquer produto com quem acompanha você. Aqui só entra o que é suave e sem perfume.</div>`;
  else h+=`<div class="block"><div class="step">Próximo passo</div><p class="r-open" style="font-size:1.3rem">Esse guia é um ponto de partida.</p><p class="r-sub">Abra o grupo que mais fez sentido, leia a descrição de cada produto no site e escolha no seu ritmo. Se mudar de ideia, refaz o quiz em um minuto.</p><a class="btn primary" href="${linkSite(CAT[R.principal].slug)}" target="_blank" rel="noopener">Ver minha seleção no site</a></div>`;
  h+=`</div>`;
  h+=`<div class="lbl">Pra você agora ${R.ordem.slice(0,3).map(chip).join(' ')}</div>`;
  const cards=R.grupos.slice(0,6);
  h+=`<div class="grid">${cards.map(gcard).join('')}${R.kit?gcard({...R.kit,why:'Combinação pronta, pra não errar'}):''}</div>`;
  h+=`<div class="foot"><a class="btn primary big" href="${linkSite(CAT[R.principal].slug)}" target="_blank" rel="noopener">Ver ${CAT[R.principal].nome} no site</a>
    <button class="btn soft" onclick="refazer()">Não era bem isso? Refazer o quiz</button></div>`;
  h+=`<details class="debug"><summary>Ver a lógica (pra quem está construindo)</summary><pre>${JSON.stringify({respostas:answers,pontos:R.pontos,ordem:R.ordem,kit:R.kit&&R.kit.nome,alerta:R.alerta},null,1)}</pre></details>`;
  return h;
}
render();
</script>
</body>
</html>
