<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>it's COOL · Qual é o seu match?</title>
<link rel="icon" href="simbolo.png?v=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap">
<style>
:root{
  --cereja:#a91231; --cereja-esc:#7d0c24; --cereja-claro:#b8203f; --terra:#e25a2f; --rosa:#bc657b; --bege:#f6e9dd; --cinza:#3a3a3a;
  --bege-claro:#fbf4ec; --bege-esc:#efdccb; --rosa-soft:#f3dadf; --terra-soft:#f7d9cb; --cereja-soft:#f2d0d6; --white:#fffdfb;
  --ink:#3a3a3a; --muted:#7a6a6c; --line:#ecd9cc;
  --serif:'DM Serif Display',Georgia,'Times New Roman',serif; --sans:'Poppins','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bege);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.topbar{background:var(--cereja);color:#fff;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;text-align:center;padding:7px 12px;display:flex;justify-content:center;gap:22px;flex-wrap:wrap;position:relative;z-index:2;font-weight:500}
.topbar span::after{content:"·";margin-left:22px;opacity:.7}
.topbar span:last-child::after{content:""}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;transition:opacity .4s}
.bg .b1{position:absolute;right:-12vw;top:-14vh;width:min(62vw,900px);height:110vh;background:var(--terra);opacity:.14;border-radius:46% 54% 42% 58%/58% 42% 58% 42%}
.bg .b2{position:absolute;left:-16vw;bottom:-30vh;width:min(50vw,700px);height:70vh;background:var(--rosa);opacity:.16;border-radius:55% 45% 50% 50%/45% 55% 45% 55%}
.bg .mao{position:absolute;right:4vw;top:50%;transform:translateY(-50%) rotate(-8deg);width:min(38vw,540px);aspect-ratio:1;background:url("simbolo.png?v=1") center/contain no-repeat;opacity:.08}
body.res .bg .mao{opacity:.04}
@media (max-width:900px){.bg .mao{width:70vw;right:-20vw;top:auto;bottom:-10vh;transform:rotate(-8deg)}}

.app{position:relative;z-index:1;max-width:1100px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:16px 22px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;min-height:64px}
.logo{display:block;line-height:0}
.logo img{height:64px;width:auto;display:block}
@media (max-width:600px){.logo img{height:52px}}
.stamp{font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-align:right;margin:-4px 2px 8px;opacity:.7}

.card{background:var(--white);border:1px solid var(--line);border-radius:22px;padding:28px 26px;box-shadow:0 14px 40px rgba(120,60,50,.08)}
.qwrap{max-width:680px;width:100%;margin:8px auto 0}
.progress{height:6px;background:var(--bege-esc);border-radius:999px;overflow:hidden;margin:0 0 22px}
.progress i{display:block;height:100%;background:var(--cereja);border-radius:999px;transition:width .35s ease}
.step{font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;color:var(--terra);font-weight:600;margin-bottom:10px}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(1.65rem,4.4vw,2.2rem);line-height:1.15;color:var(--cereja);margin:0 0 10px;text-wrap:balance}
h1 i{font-style:italic;color:var(--terra)}
.sub{color:var(--muted);font-size:.95rem;margin:0 0 20px}
.opts{display:grid;gap:10px;margin:0;padding:0;list-style:none}
@media (min-width:640px){.opts.two{grid-template-columns:1fr 1fr}.opts.icons{grid-template-columns:repeat(3,1fr)}}
.opt{width:100%;height:100%;text-align:left;background:var(--bege-claro);border:1.5px solid var(--line);border-radius:16px;padding:13px 15px;font:inherit;color:var(--ink);cursor:pointer;display:flex;align-items:flex-start;gap:12px;transition:border-color .15s, background .15s, transform .1s, box-shadow .15s}
.opt:hover{border-color:var(--rosa);background:#fff}
.opt:active{transform:scale(.99)}
.opt:focus-visible{outline:3px solid var(--terra-soft);outline-offset:2px}
.opt.on{border-color:var(--cereja);background:#fff;box-shadow:0 6px 18px rgba(169,18,49,.14)}
.opt .box{flex:none;width:20px;height:20px;margin-top:3px;border-radius:50%;border:1.5px solid var(--rosa);display:grid;place-items:center;transition:all .15s;background:#fff}
.opt.multi .box{border-radius:6px}
.opt.on .box{border-color:var(--cereja);background:var(--cereja)}
.opt.on .box::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.opt.multi.on .box::after{border-radius:2px;width:9px;height:5px;background:none;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:translateY(-1px) rotate(-45deg)}
.opt .t{flex:1}
.opt .t b{display:block;font-weight:600;line-height:1.3;font-size:.95rem;color:var(--cinza)}
.opt .t span{display:block;font-size:.82rem;color:var(--muted);margin-top:3px;line-height:1.4;font-weight:400}
.opt.ic{flex-direction:column;align-items:center;text-align:center;padding:18px 12px 16px;gap:8px;position:relative}
.opt.ic .box{position:absolute;top:10px;right:10px;margin:0}
.opt.ic .icon{width:44px;height:44px;color:var(--cereja)}
.opt.ic .icon svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.opt.ic .t b{font-size:.92rem}
.opt.ic .t span{font-size:.78rem}
.actions{display:flex;gap:10px;margin-top:22px;align-items:center;flex-wrap:wrap}
.btn{font-family:var(--sans);font-size:.8rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;border:0;border-radius:12px;padding:16px 26px;cursor:pointer;flex:1;transition:transform .12s, box-shadow .15s, background .15s;text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:10px;color:var(--ink);position:relative}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(1px);box-shadow:none!important}
.btn.primary{background:var(--cereja);color:#fff;box-shadow:0 5px 0 var(--cereja-esc), 0 12px 22px rgba(169,18,49,.25)}
.btn.primary::after{content:"→";font-size:1.05rem;line-height:1}
.btn.primary:hover{background:var(--cereja-claro)}
.btn.primary:active{transform:translateY(4px);box-shadow:0 1px 0 var(--cereja-esc)!important}
.btn.primary:disabled{opacity:.45;cursor:default;box-shadow:0 3px 0 var(--rosa);transform:none}
.btn.primary:disabled::after{content:""}
.btn.ghost{background:#fff;color:var(--cereja);border:1.5px solid var(--cereja);flex:0 0 auto;padding:11px 16px;font-size:.72rem;border-radius:999px}
.btn.ghost::before{content:"←"}
.btn.ghost:hover{background:var(--cereja-soft)}
.btn.soft{background:#fff;color:var(--cereja);border:1.5px solid var(--cereja);box-shadow:0 4px 0 var(--cereja-soft)}
.btn.soft:hover{background:var(--cereja-soft)}
.btn:focus-visible{outline:3px solid var(--terra-soft);outline-offset:2px}
.note{font-size:.82rem;color:var(--muted);margin-top:10px}
.hidden{display:none!important}
.fade{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.progress i{transition:none}}

/* boas-vindas */
.hero{max-width:620px;width:100%;margin:36px auto 0;padding:34px 30px 30px;text-align:center}
.hero h1{font-size:clamp(2rem,5vw,2.7rem);margin-bottom:12px}
.hero .lead{color:var(--muted);margin:0 0 16px;font-size:.97rem}
.hero .topicos{list-style:none;padding:0;margin:0 0 24px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;font-size:.82rem;line-height:1.35}
.hero .topicos li{padding:14px 12px;border-radius:12px;font-weight:500;color:#fff;text-align:center;display:flex;align-items:center;justify-content:center}
.hero .topicos li.c1{background:var(--cereja)}.hero .topicos li.c2{background:var(--terra)}.hero .topicos li.c3{background:var(--rosa)}
@media (max-width:520px){.hero .topicos{grid-template-columns:1fr}}
.hero .cta{display:inline-flex;width:auto;flex:none;padding:18px 30px;margin:0 auto;background:#F5B52E;color:#3a2a10;box-shadow:0 5px 0 #C48A12, 0 12px 24px rgba(196,138,18,.35);font-size:.86rem}
.hero .cta:hover{background:#FFC43D}
.hero .cta:active{box-shadow:0 1px 0 #C48A12!important}

/* resultado */
.rmain{background:var(--white);border:1px solid var(--line);border-radius:24px;overflow:hidden;display:grid;box-shadow:0 14px 40px rgba(120,60,50,.1);margin-bottom:26px}
@media (min-width:760px){.rmain{grid-template-columns:300px 1fr}}
.rmain .band{min-height:180px;display:grid;place-items:center;position:relative}
.rmain .band svg{width:120px;height:120px}
.rmain .band .cat{position:absolute;top:14px;left:14px;font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;font-weight:600;background:rgba(255,255,255,.88);color:var(--cereja);border-radius:999px;padding:4px 10px}
.rmain .body{padding:24px 26px 26px;display:flex;flex-direction:column;gap:10px}
.rmain h2{font-family:var(--serif);font-weight:400;font-size:clamp(1.5rem,3vw,2rem);line-height:1.15;color:var(--cereja);margin:0}
.rmain .desc{margin:0;font-size:.95rem;color:var(--ink)}
.rmain .porque{background:var(--bege-claro);border-left:3px solid var(--terra);border-radius:0 12px 12px 0;padding:12px 16px;font-size:.92rem}
.rmain .porque b{display:block;font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:var(--terra);font-weight:600;margin-bottom:4px}
.rmain .porque p{margin:0}
.rmain .btn{align-self:flex-start;flex:none;margin-top:6px}
.xcard .cat{display:block;font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;color:var(--terra);font-weight:600;margin-bottom:2px}
.warn{text-align:left}
.rwrap{max-width:1000px;width:100%;margin:8px auto 0}
.rhead{text-align:center;max-width:720px;margin:10px auto 26px}
.rhead h1{font-size:clamp(1.9rem,4.6vw,2.6rem)}
.rhead p{color:var(--muted);margin:0;font-size:.98rem}
.warn{background:var(--terra-soft);border-left:3px solid var(--terra);border-radius:0 14px 14px 0;padding:14px 18px;font-size:.9rem;max-width:720px;margin:0 auto 22px;text-align:left}
.warn b{color:var(--terra);font-weight:600}
.rgrid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-bottom:26px}
.rcard{background:var(--white);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 14px 40px rgba(120,60,50,.08)}
.rcard .band{height:130px;display:grid;place-items:center;position:relative}
.rcard .band svg{width:88px;height:88px}
.rcard .band .cat{position:absolute;top:12px;left:12px;font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;font-weight:600;background:rgba(255,255,255,.85);color:var(--cereja);border-radius:999px;padding:4px 10px}
.rcard .band .n{position:absolute;top:10px;right:14px;font-family:var(--serif);font-size:1.5rem;color:rgba(255,255,255,.9)}
.rcard .body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.rcard h2{font-family:var(--serif);font-weight:400;font-size:1.35rem;line-height:1.2;color:var(--cereja);margin:0}
.rcard .why{font-size:.8rem;color:var(--terra);font-weight:600}
.rcard p{margin:0;font-size:.9rem;color:var(--ink)}
.rcard .btn{margin-top:auto;font-size:.74rem;padding:14px 18px}
.band-cereja{background:linear-gradient(135deg,var(--cereja),var(--cereja-claro))}
.band-terra{background:linear-gradient(135deg,var(--terra),#ea7a52)}
.band-rosa{background:linear-gradient(135deg,var(--rosa),#cf8294)}
.band-bege{background:linear-gradient(135deg,var(--bege-esc),var(--bege))}
.extras{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-bottom:26px}
.xcard{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;gap:14px;align-items:center}
.xcard .ic{flex:none;width:56px;height:56px;border-radius:14px;overflow:hidden;background:var(--bege)}
.xcard .ic svg{width:100%;height:100%;display:block}
.xcard b{display:block;font-weight:600;font-size:.95rem;color:var(--cinza);line-height:1.25}
.xcard span{display:block;font-size:.8rem;color:var(--muted);margin-top:2px}
.xcard a{flex:none;font-size:.7rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--cereja);text-decoration:none;border-bottom:1.5px solid var(--cereja);padding-bottom:1px;white-space:nowrap}
.lbl{font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:6px 0 12px}
.rfoot{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:8px}
.rfoot .btn{flex:0 1 320px}
.debug{margin-top:26px;font-size:.76rem;color:var(--muted)}
.debug summary{cursor:pointer;font-weight:600}
.debug pre{background:var(--bege);padding:10px;border-radius:10px;overflow-x:auto;font-size:.7rem;line-height:1.4}
</style>
</head>
<body>
<div class="topbar"><span>Compra segura</span><span>Embalagem discreta</span><span>Privacidade respeitada</span></div>

    ['nunca','Acho que nunca usou',''],['algum','Já tem algum',''],['naosei','Não sei','Vou considerar iniciante, por segurança.'],
  ]},

  {id:'resultado',type:'result'},
];

/* ============================================================
   RECOMENDAÇÃO: uma principal fundamentada, complementos só
   quando têm relação com as respostas.
   ============================================================ */
const AVISO_DOR='Dor nas relações não é normal e não é frescura. Os produtos ajudam no conforto, mas vale uma conversa com ginecologista ou fisioterapeuta pélvica pra entender a causa.';
const AVISO_SAUDE='Como você passou por mudanças na saúde, indicamos o caminho mais suave. Se estiver em acompanhamento, vale combinar o uso com quem cuida de você.';

function montar(a){
  const p=pathOf(a);
  const R={intro:'',main:null,comps:[],avisos:[]};
  const main=(id,why)=>{R.main={...DEST[id],why}};
  const comp=(id,why)=>{if(!R.comps.some(c=>c.id===id)&&(!R.main||R.main.id!==id)&&R.comps.length<2) R.comps.push({...DEST[id],why})};

  /* ---- VIBRADOR (inclui "não sei → conhecer meu corpo") ---- */
  if(p==='vibrador'){
    const exp=a.vibExp||'nunca', est=a.estimulo||'naosei', sen=a.sensacao||'', prio=a.prio||[], mom=a.momento||[];
    const saude=mom.includes('saude'), secura=mom.includes('secura');
    const pr=[];
    if(prio.includes('silencioso')) pr.push('silencioso'); if(prio.includes('pequeno')) pr.push('pequeno e discreto'); if(prio.includes('agua')) pr.push('à prova d\'água'); if(prio.includes('controle')) pr.push('com controle remoto ou app'); if(prio.includes('potente')) pr.push('potente'); if(prio.includes('custo')) pr.push('com bom custo-benefício');
    const prTxt=pr.length?` Você pediu algo ${pr.join(' e ')}, então filtre por isso dentro da categoria.`:'';
    const expTxt={nunca:'você nunca usou um vibrador',naogostei:'o que você já experimentou não era bem aquilo',tenho:'você já tem um e quer uma sensação diferente',sei:'você sabe bem do que gosta'}[exp];

    if(est==='externo'){
      if(sen==='succao'){
        main('vib-externo',`Você pediu sucção ou pulsação de ar. Os sugadores ficam nesta categoria: eles criam ondas de pressão em volta do clitóris, sem encostar direto. Ignore os bullets aqui e procure os produtos descritos como sugador ou pulsador.${prTxt}`);
        R.intro=`Pelas suas respostas, ${expTxt} e tem curiosidade por uma sensação específica: a sucção no clitóris. Essa é uma das portas de entrada mais elogiadas, inclusive por quem nunca tinha usado nada.`;
      }else if(sen==='vibracao'){
        main('vib-externo',`Você quer estímulo por fora, com vibração. Esta categoria reúne bullets e vibradores externos, do mais simples ao mais potente.${prTxt}`);
        R.intro=`Pelas suas respostas, ${expTxt} e quer estímulo por fora, no clitóris, com vibração clássica. É o tipo de estímulo mais direto e o que mais gente procura.`;
      }else{
        main('vib-externo',`Você quer estímulo por fora e quer conhecer tanto vibração quanto sucção. As duas estão nesta categoria: bullets e vibradores externos de um lado, sugadores e pulsadores de outro. Compare as descrições.${prTxt}`);
        R.intro=`Pelas suas respostas, ${expTxt} e quer explorar o estímulo por fora, no clitóris, sem fechar ainda entre vibração e sucção. Boa notícia: as duas opções ficam na mesma categoria.`;
      }
    }else if(est==='interno'){
      main('vib-interno',`Você quer estímulo por dentro. Esta categoria reúne os vibradores pensados pra penetração, alguns com curva pro ponto G. Eles também podem ser usados por fora, se você quiser variar.${prTxt}`);
      R.intro=`Pelas suas respostas, ${expTxt} e quer estímulo interno, com penetração.`;
      if(exp==='nunca') comp('vib-comecar','Como é a sua primeira vez, vale olhar também os mais simples antes de decidir.');
    }else if(est==='ambos'){
      main('vib-sensacoes',`Você quer os dois estímulos ao mesmo tempo. Esta categoria reúne os vibradores de estimulação dupla, com uma ponta por dentro e outra no clitóris.${prTxt}`);
      R.intro=`Pelas suas respostas, ${expTxt} e quer sentir por fora e por dentro ao mesmo tempo.`;
    }else{
      main('vib-comecar',`Você ainda não sabe que estímulo prefere, e isso é normal. Esta categoria reúne os vibradores mais simples e versáteis, que funcionam por fora e dão pra experimentar por dentro, pra você descobrir no caminho.${prTxt}`);
      R.intro=`Pelas suas respostas, ${expTxt} e ainda não sabe que tipo de estímulo prefere. Então o caminho é começar pelo simples e versátil.`;
    }
    if(secura){ comp('hidratacao','Você marcou secura. Hidratante íntimo trata isso na base, não só na hora.'); comp('gel-neutro','Pra hora, um gel neutro tira o atrito e vai bem com qualquer vibrador.'); }
    else if(saude){ comp('gel-neutro','Pra começar com conforto, um gel neutro e sem perfume. Todo vibrador pede um.'); comp('hidratacao','Mudanças na saúde costumam mexer na lubrificação. Hidratante íntimo ajuda no dia a dia.'); }
    else comp('gel-neutro','Todo vibrador pede um gel. O neutro combina com qualquer um e não acrescenta efeito.');
    if(exp==='tenho'&&est!=='ambos'&&est!=='naosei') comp('vib-sensacoes','Você quer uma sensação diferente da que já conhece: aqui ficam os de estimulação dupla e de outras áreas.');
    if(exp==='nunca'&&est!=='naosei'&&R.main.id!=='vib-comecar') comp('kits','Pra primeira vez, um kit traz o vibrador com o gel e evita errar na combinação.');
    if(saude) R.avisos.push(AVISO_SAUDE);

  /* ---- A DOIS ---- */
  else if(p==='dois'){

    const quer=[]; if(d1.includes('sensacoes')) quer.push('novas sensações durante a relação'); if(d1.includes('rotina')) quer.push('sair da rotina e brincar'); if(d1.includes('fantasias')) quer.push('explorar fantasias'); if(d1.includes('conforto')) quer.push('mais conforto'); if(d1.includes('clima')) quer.push('clima e toque'); if(d1.includes('descobrir')) quer.push('descobrir algo novo');
    R.intro=`Pelas suas respostas, vocês querem ${quer.join(' e ')||'viver algo novo a dois'}.`+(d5==='nunca'?' Seria a primeira vez usando algo juntos, então a indicação é simples de incluir, sem mudar o que vocês já fazem.':d5==='intimidade'?' Vocês já têm intimidade com brinquedos, então dá pra ir além do básico.':'');

    if(d1.includes('sensacoes')){

      if(d5==='nunca') comp('kits','Como seria a primeira vez, um kit a dois traz o brinquedo com o gel e evita errar na combinação.');
    }
    if(d1.includes('rotina')){ if(!R.main) main('jogos','Vocês querem sair da rotina. Cartas, dados e tabuleiros de casal criam o convite e tiram a pressão de "ter que acontecer".'); else comp('jogos','Pra sair da rotina: cartas e dados que fazem o convite por vocês.'); }
    if(d1.includes('fantasias')){ if(!R.main) main('aces-dominar','Vocês querem explorar fantasias e jogos de poder. Vendas, algemas e kits pra brincar de restrição e controle, sempre consensual e combinado antes.'); else comp('aces-dominar','Pra explorar fantasias: vendas, algemas e kits, sempre combinados antes.'); }
    if(d1.includes('clima')){ if(!R.main) main('massagem','Vocês querem começar pelo clima e pelo toque. Velas de massagem, óleos e sais de banho pro corpo inteiro, antes de qualquer outra coisa.'); else comp('massagem','Pra criar clima: velas de massagem e óleos pro corpo inteiro.'); }
    if(d1.includes('conforto')){ const g=gelMap[d3]||gelMap.neutro; if(!R.main) main(g[0],`Vocês querem mais conforto na relação. ${g[1]} Hoje em dia muitos lubrificantes são chamados de deslizantes, mas a função é a mesma.`); else comp(g[0],g[1]); }
    if(d1.includes('descobrir')){ if(!R.main) main('jogos','Vocês querem descobrir algo novo sem saber o quê. Um jogo de casal é o jeito mais leve de começar: ele faz as perguntas e os convites por vocês, e mostra do que os dois gostam.'); comp('massagem','Clima e toque são um começo seguro pra quem ainda não sabe o que quer.'); }
    if(R.main&&R.main.cat==='PRAZER'&&R.main.id.startsWith('vib')&&d3&&d3!=='nao'){ const g=gelMap[d3]; comp(g[0],g[1]); }
    else if(R.main&&R.main.id.startsWith('vib')&&!d3) comp('gel-neutro','Todo brinquedo pede um gel. O neutro combina com qualquer um.');
    if(!R.main) main('jogos','Vocês querem viver algo novo a dois. Um jogo de casal é o jeito mais leve de começar.');
  }

  /* ---- CUIDADO ÍNTIMO (inclui "não sei → cuidar" e "→ conforto") ---- */
  else if(p==='cuidado'||p==='conforto'){
    const c1=p==='conforto'?['conforto']:(a.c1||[]), c2=a.c2||[], c3=a.c3||[];
    const fase=c3.includes('menopausa')||c3.includes('posparto'), saude=c3.includes('saude'), med=c3.includes('medicacao');
    const partes=[];
    if(c2.includes('secura')) partes.push('sente secura');
    if(c2.includes('dor')) partes.push('sente dor ou desconforto nas relações');
    if(c2.includes('sensivel')) partes.push('tem a região sensível');
    if(c2.includes('pelvico')) partes.push('quer cuidar do assoalho pélvico');
    const ctx=c3.includes('menopausa')?' Na menopausa, a secura é esperada e tem solução.':c3.includes('posparto')?' No pós-parto e na amamentação, a secura é esperada e tem solução.':saude?' Mudanças na saúde costumam mexer na lubrificação e na sensibilidade, e isso tem cuidado.':med?' Alguns remédios mexem na lubrificação e no desejo, e isso tem cuidado.':'';
    const quer=[]; if(c1.includes('higiene')) quer.push('higiene'); if(c1.includes('hidratacao')) quer.push('hidratação'); if(c1.includes('conforto')) quer.push('mais conforto nas relações'); if(c1.includes('cosmeticos')) quer.push('cosméticos íntimos'); if(c1.includes('pelvico')) quer.push('conhecer o próprio corpo');
    R.intro=`Pelas suas respostas, você quer ${quer.length?quer.join(', '):'conhecer as possibilidades do cuidado íntimo'}${partes.length?' e '+partes.join(', '):''}.${ctx}`;

    // prioridade: queixa clínica > fase > interesse declarado
    if(c2.includes('dor')){ main('hidratacao','Dor ou desconforto na relação costuma ter a ver com pouca lubrificação ou com a musculatura pélvica. Começamos pelo hidratante íntimo, que trata a secura na base e deixa a região mais confortável no dia a dia.'); comp('gel-neutro','Pra hora da relação, um gel neutro e sem perfume tira o atrito.'); comp('pelvica','Dilatadores e exercitadores ajudam a musculatura a relaxar e a ganhar controle, de preferência com orientação de fisioterapeuta pélvica.'); R.avisos.push(AVISO_DOR); }
    else if(c2.includes('secura')||fase||saude||med){ main('hidratacao',`Secura se trata na base, não só na hora. O hidratante íntimo é de uso contínuo, como um creme pra região, e devolve conforto no dia a dia.${ctx}`); comp('gel-neutro','Pra hora da relação, um gel neutro e sem perfume complementa o hidratante.'); if(c2.includes('pelvico')||c1.includes('pelvico')) comp('pelvica','Pra musculatura pélvica: exercitadores, pompoarismo e materiais educativos.'); else if(c2.includes('sensivel')) comp('higiene','Com a região sensível, um sabonete íntimo suave e sem perfume faz diferença.'); }
    else if(c2.includes('pelvico')||c1.includes('pelvico')){ main('pelvica','Você quer cuidar do assoalho pélvico. Esta categoria reúne exercitadores, pompoarismo, dilatadores e materiais pra conhecer o próprio corpo. Escape de xixi, sensação de peso e menos controle melhoram com treino.'); if(c1.includes('hidratacao')) comp('hidratacao','Hidratante íntimo de uso contínuo pro conforto do dia a dia.'); if(c1.includes('higiene')) comp('higiene','Sabonetes próprios pra região, pro dia a dia.'); }
    else if(c2.includes('sensivel')){ main('higiene','Com a região sensível ou irritada, o primeiro cuidado é a higiene certa: sabonetes íntimos suaves, com pH adequado e sem perfume forte.'); comp('hidratacao','Hidratante íntimo acalma e protege a região no dia a dia.'); R.avisos.push('Se a irritação for frequente ou vier com corrimento, vale uma avaliação com ginecologista antes de testar produtos.'); }
    else if(c1.includes('conforto')){ main('gel-neutro','Você quer mais conforto nas relações. Um gel neutro tira o atrito, não tem cheiro nem efeito e combina com tudo, inclusive preservativo. Hoje muitos são chamados de deslizantes, mas a função é a mesma.'); comp('hidratacao','Se o desconforto se repete, o hidratante íntimo trata a secura na base.'); }
    else if(c1.includes('hidratacao')){ main('hidratacao','Você quer hidratar a região íntima. Hidratante é de uso contínuo, como um creme pra pele, e é diferente do lubrificante, que é pra hora.'); if(c1.includes('higiene')) comp('higiene','Sabonetes próprios pra região completam a rotina.'); if(c1.includes('cosmeticos')) comp('cosmeticos','Óleos, séruns e perfumes íntimos pra complementar.'); }
    else if(c1.includes('higiene')){ main('higiene','Você quer cuidar da higiene íntima. Esta categoria reúne sabonetes e produtos próprios pra região, com pH adequado, pro dia a dia.'); if(c1.includes('cosmeticos')) comp('cosmeticos','Óleos, séruns e perfumes íntimos pra complementar.'); else comp('hidratacao','Hidratação de uso contínuo completa a rotina.'); }
    else if(c1.includes('cosmeticos')){ main('cosmeticos','Você quer cosméticos íntimos. Perfumes, óleos, cremes e séruns pensados e testados pra região, com segurança de uso.'); comp('higiene','Um sabonete íntimo próprio é a base da rotina.'); }
    else { main('hidratacao','Você quer conhecer as possibilidades do cuidado íntimo. O melhor ponto de partida é a hidratação: é o cuidado que mais gente precisa e menos gente conhece, e explica a diferença entre hidratante e lubrificante.'); comp('higiene','Sabonetes próprios pra região são o básico da rotina.'); comp('pelvica','Pra conhecer o próprio corpo e a musculatura pélvica.'); }
    if(saude&&!R.avisos.length) R.avisos.push(AVISO_SAUDE);
  }

  /* ---- ANAL ---- */
  else if(p==='anal'){
    const a1=a.a1||'nunca', a2=a.a2||[], a3=a.a3||[], mom=a.momento||[];
    const expTxt={nunca:'você nunca experimentou',pouca:'você já experimentou um pouco',sim:'você já tem intimidade com prazer anal'}[a1];
    R.intro=`Pelas suas respostas, ${expTxt}.`+(a1==='nunca'?' O segredo é começar pelo menor, com gel próprio e sem pressa. A região não lubrifica sozinha, então gel não é opcional.':'');
    if(a2.includes('vibracao')&&a1!=='nunca') main('anal-vib','Você quer vibração e estímulo anal. Esta categoria reúne plugs com motor e estimuladores pensados pra região, alguns com controle remoto.');
    else if(a2.includes('conforto')&&!a2.includes('plugs')&&!a2.includes('vibracao')) main('anal-gel','Você quer mais conforto. Os géis anais são mais espessos e duradouros que os comuns, e alguns têm relaxante suave, sem anestesiar, porque dor é um sinal importante.');
    else if(a2.includes('higiene')&&a2.length===1) main('anal-higiene','Você quer se sentir tranquila antes e depois. Esta categoria reúne duchas e produtos de higiene pensados pra região anal.');
    else main('anal-plugs',a1==='nunca'?'Pra começar, plugs pequenos, de silicone e com base larga (a base larga é obrigatória, por segurança). Esta categoria vai do menor ao maior pra você evoluir no seu ritmo.':'Plugs de diferentes tamanhos e formatos pra evoluir com conforto. Procure os de silicone e com base larga.');
    if(R.main.id!=='anal-gel') comp('anal-gel','Indispensável. A região não lubrifica sozinha, e o gel anal é mais espesso e duradouro que o comum.');
    if(a1==='nunca'&&R.main.id!=='anal-higiene') comp('anal-higiene','Pra se sentir tranquila antes e depois.');
    else if(a2.includes('vibracao')&&R.main.id!=='anal-vib') comp('anal-vib','Quando quiser mais sensação, os com vibração ficam aqui.');
    if(mom.includes('saude')) R.avisos.push(AVISO_SAUDE);
    if(a3.includes('custo')) R.sale=true;

  else if(p==='presente'){

    R.intro=`Um presente ${({delicado:'delicado, de cuidado',divertido:'leve e divertido',ousado:'ousado, com classe',completo:'completo'})[c]} pra ${quem}.`+(i==='nunca'||i==='naosei'?' Como a pessoa provavelmente nunca usou nada, a indicação é fácil de incluir e sem constrangimento.':'');
    if(c==='delicado'){ main('massagem','Velas de massagem, óleos e sais de banho. É presente de cuidado, bonito de abrir e sem nada que constranja.'); comp('cosmeticos','Perfumes e óleos íntimos completam o clima de cuidado.'); }

  }

  /* ---- SÓ CURIOSIDADE (não sei → curiosa) ---- */
  else if(p==='curiosa'){
    const e4=a.e4||'simples';
    R.intro='Pelas suas respostas, você está mais na curiosidade do que numa necessidade, e isso é um ótimo lugar pra começar.';
    if(e4==='simples'){ main('vib-comecar','Pra começar com algo simples e discreto, só pra você: os vibradores mais simples e versáteis, pequenos e fáceis de usar, sem complicação.'); comp('gel-neutro','Todo vibrador pede um gel. O neutro combina com qualquer um.'); comp('kits','Se preferir não escolher, um kit traz o básico pronto.'); }
    else if(e4==='brincar'){ main('jogos','Pra brincar e rir: cartas e dados que quebram o gelo e fazem os convites por você.'); comp('massagem','Clima e toque são o passo seguinte natural.'); }
    else if(e4==='cuidar'){ main('massagem','Pra começar pelo cuidado e bem-estar: velas de massagem, óleos e sais de banho.'); comp('cosmeticos','Óleos, séruns e perfumes íntimos completam o cuidado.'); }
    else { main('kits','Um kit pronto: combinação já pensada pra funcionar junto, sem risco de errar.'); comp('vib-comecar','Se quiser escolher você mesma, os mais simples ficam aqui.'); }
  }

  if(!R.main) main('vib-comecar','O caminho mais simples pra começar.');
  if(!R.intro) R.intro='Pelas suas respostas, esse é o melhor ponto de partida.';
  return R;
}

/* ============================================================
   APP
   ============================================================ */
let answers={}; let idx=-1;
const view=document.getElementById('view'), btnBack=document.getElementById('btnBack');
const visible=()=>SCREENS.filter(s=>!s.when||s.when(answers));
try{const saved=JSON.parse(sessionStorage.getItem('itscool-quiz-v18')||'null'); if(saved){answers=saved.answers||{}; idx=saved.idx??-1;}}catch(e){}
const persist=()=>{try{sessionStorage.setItem('itscool-quiz-v18',JSON.stringify({answers,idx}))}catch(e){}};

function render(){
  persist();
  const vis=visible();
  btnBack.classList.toggle('hidden',idx<0);
  view.className=''; void view.offsetWidth; view.className='fade';
  document.body.classList.remove('res');
  if(idx<0){view.innerHTML=welcome(); window.scrollTo(0,0); return;}
  const s=vis[Math.min(idx,vis.length-1)];
  const answerable=vis.filter(x=>x.type!=='result').length;
  const pct=s.type==='result'?100:Math.round(idx/answerable*100);
  const bar=`<div class="progress"><i style="width:${pct}%"></i></div>`;
  if(s.type==='result'){document.body.classList.add('res'); view.innerHTML=resultado(montar(answers));}
  else view.innerHTML=`<div class="qwrap"><div class="card">${bar}${question(s,idx+1,answerable)}</div></div>`;
  window.scrollTo(0,0);
}
function welcome(){
  return `<div class="card hero">
    <div class="step">O quiz mais cool da internet</div>
    <h1>Não sabe por onde começar? <i>Normal.</i> Quase ninguém sabe.</h1>
    <p class="lead">Responda algumas perguntas e a gente te mostra quais categorias do site combinam com o que você procura, e o que cada uma é.</p>
    <ul class="topicos">
      <li class="c1">Você entende antes de comprar.</li>
      <li class="c2">Sem julgamento. Pula o que não quiser responder.</li>
      <li class="c3">Feito pra quem nunca entrou numa loja.</li>
    </ul>
    <button class="btn primary cta" onclick="go(0)">Qual é o meu match?</button>
  </div>`;
}
const ICONS={
  vibrador:'<svg viewBox="0 0 48 48"><path d="M24 6c1 9 6 16 18 18-12 2-17 9-18 18-1-9-6-16-18-18 12-2 17-9 18-18z"/></svg>',
  dois:'<svg viewBox="0 0 48 48"><path d="M18 36S6 28 6 19a6 6 0 0 1 12-1 6 6 0 0 1 12 1c0 9-12 17-12 17z"/><path d="M30 42s-10-7-10-15a5 5 0 0 1 10-1 5 5 0 0 1 10 1c0 8-10 15-10 15z"/></svg>',
  cuidado:'<svg viewBox="0 0 48 48"><path d="M40 8C22 8 10 18 8 40c22-2 32-14 32-32zM8 40c8-10 16-18 26-26"/></svg>',
  anal:'<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="16"/><circle cx="24" cy="24" r="7"/></svg>',
  presente:'<svg viewBox="0 0 48 48"><rect x="6" y="18" width="36" height="8" rx="2"/><path d="M9 26v16h30V26M24 18v24M24 18c-4-8-12-8-12-3s8 3 12 3zm0 0c4-8 12-8 12-3s-8 3-12 3z"/></svg>',
  explorar:'<svg viewBox="0 0 48 48"><circle cx="22" cy="22" r="13"/><path d="M32 32l10 10"/><path d="M17 20a5 5 0 0 1 10 0c0 4-5 4-5 8M22 33v1"/></svg>',
};
function question(s,n,total){
  const cur=answers[s.id], isMulti=s.type==='multi';
  const opts=s.opts.map(([v,l,h])=>{
    const on=isMulti?(cur||[]).includes(v):cur===v;
    const ic=s.icons&&ICONS[v]?`<span class="icon">${ICONS[v]}</span>`:'';
    return `<li><button type="button" class="opt ${isMulti?'multi':''} ${s.icons?'ic':''} ${on?'on':''}" data-v="${v}" onclick="pick('${s.id}','${v}')"><span class="box"></span>${ic}<span class="t"><b>${l}</b>${h?`<span>${h}</span>`:''}</span></button></li>`;
  }).join('');
  const cont=isMulti?`<div class="actions"><button class="btn primary" id="btnNext" onclick="next()" ${(cur||[]).length?'':'disabled'}>Continuar</button></div>`:'';
  return `<div class="step">Pergunta ${n} de ${total}</div><h1>${s.q}</h1><p class="sub">${s.sub||''}</p><ul class="opts ${s.icons?'icons':(s.two?'two':'')}">${opts}</ul>${cont}`;
}
function pick(id,v){
  const s=SCREENS.find(x=>x.id===id);
  if(s.type==='single'){answers[id]=v; limpar(id); setTimeout(next,140); return;}
  let cur=[...(answers[id]||[])]; const excl=s.exclusive||[];
  if(cur.includes(v)) cur=cur.filter(x=>x!==v);
  else{ if(excl.includes(v)) cur=[v]; else cur=cur.filter(x=>!excl.includes(x)).concat(v); if(s.max&&cur.length>s.max) cur=cur.slice(-s.max); }
  answers[id]=cur; limpar(id);
  document.querySelectorAll('.opt').forEach(b=>b.classList.toggle('on',cur.includes(b.dataset.v)));
  const bn=document.getElementById('btnNext'); if(bn) bn.disabled=!cur.length;
  persist();
}
function limpar(id){
  if(id==='motivo'||id==='e1'){ const keep={motivo:answers.motivo}; if(id==='e1') keep.e1=answers.e1; answers=keep; }
  if(id==='estimulo') delete answers.sensacao;
  if(id==='d1'){ delete answers.d2; delete answers.d3; delete answers.d5; }
  if(id==='p2') delete answers.p3;
}
function go(i){idx=i; render();}
function next(){idx=Math.min(idx+1,visible().length-1); render();}
btnBack.onclick=()=>{idx=Math.max(-1,idx-1); render();};
function refazer(){answers={}; idx=-1; render();}

function mainCard(d){
  const c=CAT[d.cat];
  return `<article class="rmain"><div class="band ${c.band}"><span class="cat">${c.nome}</span>${ART[d.art]||ART.caixa}</div>
    <div class="body"><div class="step">Nossa indicação principal</div><h2>${d.nome}</h2><p class="desc">${d.desc}</p>
    <div class="porque"><b>Por que pra você</b><p>${d.why}</p></div>
    <a class="btn primary" href="${link(d.slug)}" target="_blank" rel="noopener">Ver os produtos</a></div></article>`;
}
function compCard(d){
  return `<div class="xcard"><div class="ic">${ART[d.art]||ART.caixa}</div><div style="flex:1"><span class="cat">${CAT[d.cat].nome}</span><b>${d.nome}</b><span>${d.why}</span></div><a href="${link(d.slug)}" target="_blank" rel="noopener">Ver</a></div>`;
}
function resultado(R){
  let h=`<div class="rwrap"><div class="rhead"><div class="step">Seu match</div><h1>A gente <i>entendeu</i> o que você procura.</h1><p>${R.intro}</p></div>`;
  R.avisos.forEach(t=>{h+=`<div class="warn">${t}</div>`});
  h+=mainCard(R.main);
  if(R.comps.length) h+=`<div class="lbl">Combina com a indicação</div><div class="extras">${R.comps.map(compCard).join('')}</div>`;
  if(R.sale) h+=`<p class="note" style="text-align:center">Você pediu custo-benefício: vale conferir também a seção <a href="${link('sale')}" target="_blank" rel="noopener" style="color:var(--cereja);font-weight:600">Sale</a>, filtrando pela categoria indicada.</p>`;
  h+=`<div class="rfoot"><button class="btn soft" onclick="refazer()">Refazer o quiz</button></div>`;
  h+=`<details class="debug"><summary>Ver a lógica (pra quem está construindo)</summary><pre>${JSON.stringify({caminho:pathOf(answers),respostas:answers},null,1)}</pre></details></div>`;
  return h;
}
render();
</script>
</body>
</html>
