.rmain .porque{background:var(--bege-claro);border-left:3px solid var(--terra);border-radius:0 12px 12px 0;padding:12px 16px;font-size:.92rem}
.rmain .porque b{display:block;font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:var(--terra);font-weight:600;margin-bottom:4px}

.xcard .cat{display:block;font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;color:var(--terra);font-weight:600;margin-bottom:2px}
.warn{text-align:left}
.rwrap{max-width:1200px;width:100%;margin:8px auto 0}

<script>

   LINKS DO SITE (trocar pelos endereços reais do Wix)
   ============================================================ */
const URL_SITE='https://itscool.com.br/';
const link=slug=>URL_SITE+slug;

/* ============================================================
   CATEGORIAS PRINCIPAIS DO MENU
   ============================================================ */

  PRAZER:{nome:'Prazer',band:'band-cereja',slug:'prazer'},

  sugador:svg(K.rs,`<path d="M34 12h16a6 6 0 0 1 6 6v36a14 14 0 0 1-28 0V18a6 6 0 0 1 6-6z" fill="${K.c}"/><circle cx="42" cy="58" r="9" fill="${K.w}"/><circle cx="42" cy="58" r="4" fill="${K.rs}"/><circle cx="42" cy="26" r="3" fill="${K.w}"/>`),

  anel:svg(K.bs,`<circle cx="42" cy="44" r="22" fill="none" stroke="${K.c}" stroke-width="10"/><circle cx="42" cy="18" r="7" fill="${K.t}"/>`),
  casal:svg(K.rs,`<path d="M20 30c0-10 10-16 16-8 6-8 16-2 16 8 0 12-16 22-16 22S20 42 20 30z" fill="${K.c}"/><path d="M40 52c0-8 8-12 12-6 4-6 12-2 12 6 0 9-12 16-12 16s-12-7-12-16z" fill="${K.t}"/>`),
  bullet:svg(K.ts,`<path d="M42 10c10 0 14 8 14 20v30a14 14 0 0 1-28 0V30c0-12 4-20 14-20z" fill="${K.c}"/><circle cx="42" cy="62" r="4" fill="${K.w}"/><path d="M60 22l4-4M62 32h6M24 22l-4-4M22 32h-6" stroke="${K.t}" stroke-width="3" stroke-linecap="round"/>`),

  tubo:svg(K.bs,`<path d="M30 14h24l4 16v40a6 6 0 0 1-6 6H32a6 6 0 0 1-6-6V30z" fill="${K.w}"/><rect x="34" y="8" width="16" height="8" rx="2" fill="${K.c}"/><rect x="32" y="40" width="20" height="16" rx="4" fill="${K.r}"/>`),
  termico:svg(K.ts,`<path d="M30 14h24l4 16v40a6 6 0 0 1-6 6H32a6 6 0 0 1-6-6V30z" fill="${K.w}"/><rect x="34" y="8" width="16" height="8" rx="2" fill="${K.c}"/><path d="M36 46c0-6 6-8 6-14 0 6 6 8 6 14a6 6 0 0 1-12 0z" fill="${K.t}"/>`),

      const w=(why[id]||[]); const txt=w.length?w[0].charAt(0).toUpperCase()+w[0].slice(1)+(w.length>1?'. E também: '+w.slice(1).join('; ')+'.':'.'):DEST[id].desc;
      rec(id,txt+(id.startsWith('vib')?fTxt:''),it[id]);
    });
  }

  if(!R.recs.length) rec('vib-comecar','O caminho mais simples pra começar.');
  const PAD={vibrador:[['gel-neutro','Todo vibrador pede um gel neutro: tira o atrito e protege o silicone.'],['higiene','Limpador de brinquedo e sabonete íntimo mantêm tudo seguro.'],['kits','Se preferir não montar sozinha, os kits já vêm combinados.']],
    cuidado:[['higiene','Sabonetes próprios pra região são a base da rotina.'],['hidratacao','Hidratação de uso contínuo completa qualquer rotina de cuidado.'],['cosmeticos','Óleos, séruns e perfumes íntimos complementam o cuidado.']],
    anal:[['anal-higiene','Pra se sentir tranquila antes e depois.'],['anal-gel','Indispensável: a região não lubrifica sozinha.'],['kits','Kits de iniciação trazem plug e gel combinados.']],
    presente:[['massagem','Uma vela de massagem acompanha bem qualquer presente.'],['jogos','Um jogo leve quebra o gelo.'],['kits','Combinações prontas que não erram.']],
    curiosa:[['gel-neutro','Todo começo pede um gel neutro.'],['massagem','Clima e toque são um começo sem pressão.'],['jogos','Pra brincar e rir, sem compromisso.']]};
  PAD.explorar=[['vib-comecar','Os vibradores mais simples e versáteis são o começo mais seguro.'],['massagem','Clima e toque são um começo sem pressão.'],['hidratacao','O cuidado que mais gente precisa e menos gente conhece.']];
  for(const [id,why] of (PAD[p]||PAD.explorar)){ if(R.recs.length>=3) break; rec(id,why); }
  if(!R.intro) R.intro='Pelas suas respostas, esse é o melhor ponto de partida.';
  return R;
}

/* ============================================================
   APP
   ============================================================ */
let answers={}; let idx=-1;
const view=document.getElementById('view'), btnBack=document.getElementById('btnBack');
const visible=()=>SCREENS.filter(s=>!s.when||s.when(answers));
try{const saved=JSON.parse(sessionStorage.getItem('itscool-quiz-v30')||'null'); if(saved){answers=saved.answers||{}; idx=saved.idx??-1;}}catch(e){}
const persist=()=>{try{sessionStorage.setItem('itscool-quiz-v30',JSON.stringify({answers,idx}))}catch(e){}};

function render(){
  persist();
  const vis=visible();
  btnBack.classList.toggle('hidden',idx<0);
  view.className=''; void view.offsetWidth; view.className='fade';
  document.body.classList.remove('res');
  if(idx<0){view.innerHTML=welcome(); window.scrollTo(0,0); return;}
  const s=vis[Math.min(idx,vis.length-1)];
  const answerable=vis.filter(x=>x.type!=='result').length;
  const pct=s.type==='result'?100:Math.round(idx/answerable*100);
  const bar=`<div class="progress"><i style="width:${pct}%"></i></div>`;
  if(s.type==='result'){document.body.classList.add('res'); view.innerHTML=resultado(montar(answers));}
  else view.innerHTML=`<div class="qwrap"><div class="card">${bar}${question(s,idx+1,answerable)}</div></div>`;
  window.scrollTo(0,0);
}
function welcome(){
  return `<div class="card hero">
    <div class="step">O quiz mais cool da internet</div>
    <h1>Não sabe por onde começar? <i>Normal.</i> Quase ninguém sabe.</h1>
    <p class="lead">Responda algumas perguntas e a gente te mostra quais categorias do site combinam com o que você procura, e o que cada uma é.</p>
    <ul class="topicos">
      <li class="c1">Você entende antes de comprar.</li>
      <li class="c2">Sem julgamento. Pula o que não quiser responder.</li>
      <li class="c3">Feito pra quem nunca entrou numa loja.</li>
    </ul>
    <button class="btn primary cta" onclick="go(0)">Qual é o meu match?</button>
  </div>`;
}
const ICONS={
  vibrador:'<svg viewBox="0 0 48 48"><path d="M24 6c1 9 6 16 18 18-12 2-17 9-18 18-1-9-6-16-18-18 12-2 17-9 18-18z"/></svg>',
  dois:'<svg viewBox="0 0 48 48"><path d="M18 36S6 28 6 19a6 6 0 0 1 12-1 6 6 0 0 1 12 1c0 9-12 17-12 17z"/><path d="M30 42s-10-7-10-15a5 5 0 0 1 10-1 5 5 0 0 1 10 1c0 8-10 15-10 15z"/></svg>',
  cuidado:'<svg viewBox="0 0 48 48"><path d="M40 8C22 8 10 18 8 40c22-2 32-14 32-32zM8 40c8-10 16-18 26-26"/></svg>',
  anal:'<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="16"/><circle cx="24" cy="24" r="7"/></svg>',
  presente:'<svg viewBox="0 0 48 48"><rect x="6" y="18" width="36" height="8" rx="2"/><path d="M9 26v16h30V26M24 18v24M24 18c-4-8-12-8-12-3s8 3 12 3zm0 0c4-8 12-8 12-3s-8 3-12 3z"/></svg>',
  explorar:'<svg viewBox="0 0 48 48"><circle cx="22" cy="22" r="13"/><path d="M32 32l10 10"/><path d="M17 20a5 5 0 0 1 10 0c0 4-5 4-5 8M22 33v1"/></svg>',
};
function question(s,n,total){
  const cur=answers[s.id], isMulti=s.type==='multi';
  const opts=s.opts.map(([v,l,h])=>{
    const on=isMulti?(cur||[]).includes(v):cur===v;
    const ic=s.icons&&ICONS[v]?`<span class="icon">${ICONS[v]}</span>`:'';
    return `<li><button type="button" class="opt ${isMulti?'multi':''} ${s.icons?'ic':''} ${on?'on':''}" data-v="${v}" onclick="pick('${s.id}','${v}')"><span class="box"></span>${ic}<span class="t"><b>${l}</b>${h?`<span>${h}</span>`:''}</span></button></li>`;
  }).join('');
  const cont=isMulti?`<div class="actions"><button class="btn primary" id="btnNext" onclick="next()" ${(cur||[]).length?'':'disabled'}>Continuar</button></div>`:'';
  return `<div class="step">Pergunta ${n} de ${total}</div><h1>${s.q}</h1><p class="sub">${s.sub||''}</p><ul class="opts ${s.icons?'icons':(s.two?'two':'')}">${opts}</ul>${cont}`;
}
function pick(id,v){
  const s=SCREENS.find(x=>x.id===id);
  if(s.type==='single'){answers[id]=v; limpar(id); setTimeout(next,140); return;}
  let cur=[...(answers[id]||[])]; const excl=s.exclusive||[];
  if(cur.includes(v)) cur=cur.filter(x=>x!==v);
  else{ if(excl.includes(v)) cur=[v]; else cur=cur.filter(x=>!excl.includes(x)).concat(v); if(s.max&&cur.length>s.max) cur=cur.slice(-s.max); }
  answers[id]=cur; limpar(id);
  document.querySelectorAll('.opt').forEach(b=>b.classList.toggle('on',cur.includes(b.dataset.v)));
  const bn=document.getElementById('btnNext'); if(bn) bn.disabled=!cur.length;
  persist();
}
function limpar(id){
  if(id==='motivo'){ answers={motivo:answers.motivo}; }
  if(id==='estimulo'){ delete answers.sensacao; delete answers.interno; delete answers.duplo; }
  if(id==='c2') delete answers.quando;
}
function go(i){idx=i; render();}
function next(){idx=Math.min(idx+1,visible().length-1); render();}
btnBack.onclick=()=>{idx=Math.max(-1,idx-1); render();};
function refazer(){answers={}; idx=-1; render();}

function recCard(d,i){
  const c=CAT[d.cat];
  return `<article class="rec"><div class="band ${c.band}"><span class="cat">${c.nome}</span><span class="n">0${i+1}</span>${ART[d.art]||ART.caixa}</div>
    <div class="body"><h2>${d.nome}</h2><p class="desc">${d.desc}</p>
    <div class="porque"><b>Por que pra você</b><p>${d.why}</p></div>
    ${d.itens&&d.itens.length?`<div class="itens"><b>O que encaixa no seu perfil aqui</b><ul>${d.itens.map(x=>`<li>${x}</li>`).join('')}</ul></div>`:''}
    <a class="btn primary" href="${link(d.slug)}" target="_blank" rel="noopener">Ver os produtos</a></div></article>`;
}
function resultado(R){
  const n=R.recs.length;
  let h=`<div class="rwrap"><div class="rhead"><div class="step">Seu match</div><h1>A gente <i>entendeu</i> o que você procura.</h1><p>${R.intro}</p></div>`;
  R.avisos.forEach(t=>{h+=`<div class="warn">${t}</div>`});
  h+=`<div class="lbl" style="text-align:center;justify-content:center">Categorias mais indicadas pra você</div>`;
  h+=`<div class="recs ${n<=2?'two':''}" style="--n:${n}">${R.recs.map(recCard).join('')}</div>`;
  if(R.sale) h+=`<p class="note" style="text-align:center">Você pediu custo-benefício: vale conferir também a seção <a href="${link('sale')}" target="_blank" rel="noopener" style="color:var(--cereja);font-weight:600">Sale</a>, filtrando pelas categorias indicadas.</p>`;
  h+=`<div class="rfoot"><button class="btn soft" onclick="refazer()">Refazer o quiz</button></div>`;
  h+=`<details class="debug"><summary>Ver a lógica (pra quem está construindo)</summary><pre>${JSON.stringify({caminho:pathOf(answers),respostas:answers},null,1)}</pre></details></div>`;
  return h;
}
render();
</script>
